# Fly.io: one always-on machine in Ashburn, Virginia (iad), serving the web app and the API.
# ANTHROPIC_API_KEY is a Fly secret. The audit store lives on the "audit_data" volume.
# Deploy steps: README, "Deploy to Fly.io".

app = "gl-loanappassist"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # One cap across all visitors: the contractor header is set by the caller in this demo.
  RATE_LIMIT_ALL_PER_DAY = "300"

[mounts]
  source = "audit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: no cold start when a reviewer opens the link.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # A ceiling on parallel requests, so a script can't flood the machine or its audit volume.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
